<!-- templates/rcmpsp/no_results.html -->
{% extends "base.html" %}

{% block title %}RCMPSP Results - No Data{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card mt-5">
                <div class="card-header">
                    <h5 class="mb-0">No RCMPSP Results Found</h5>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> {{ message }}
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <div>
                            <p><strong>Active Schedule:</strong> {{ schedule.name }}</p>
                        </div>
                        <div>
                            <a href="{{ url_for('rcmpsp.index') }}" class="btn btn-primary">
                                <i class="bi bi-lightning"></i> Run Optimization
                            </a>
                            <a href="{{ url_for('config_module.index') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back to Configuration
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
