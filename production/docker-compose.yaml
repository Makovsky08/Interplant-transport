services:
  # Main Flask application
  flask_app:
    build:
      context: ..
      dockerfile: production/Dockerfile
    container_name: flask_app
    expose:
      - "5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - DATABASE_PATH=/app/data/SchedLine.db
    volumes:
      - ../:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - sqlite_db
 
  # Nginx web server
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../static:/usr/share/nginx/html/static
    depends_on:
      - flask_app
    restart: unless-stopped

  # SQLite database service (minimal container just for managing the database file)
  sqlite_db:
    image: alpine:latest
    container_name: sqlite_db
    volumes:
      - ../data:/data
    command: >
      sh -c "apk add --no-cache sqlite &&
             mkdir -p /data &&
             sqlite3 /data/SchedLine.db '.databases' &&
             chmod 777 /data/SchedLine.db &&
             tail -f /dev/null"
    restart: unless-stopped
